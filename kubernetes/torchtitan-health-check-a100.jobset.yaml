# torchtitan health-check JobSet for OCI OKE — NVIDIA BM.GPU4.8 (A100)
#
# Runs llama3-8B with synthetic data and reports TFLOPs/MFU.
# No dataset download or tokenizer required.
#
# Quick start (2 nodes = 16 GPUs):
#   kubectl apply -f kubernetes/torchtitan-health-check-a100.jobset.yaml
---
apiVersion: jobset.x-k8s.io/v1alpha2
kind: JobSet
metadata:
  name: torchtitan-health-check-a100
  namespace: default
  labels:
    kueue.x-k8s.io/queue-name: torchtitan-a100
spec:
  # Restart the entire JobSet on any failure (set to 0 for one-shot health checks)
  failurePolicy:
    maxRestarts: 0

  replicatedJobs:
  - name: workers
    replicas: 1
    template:
      spec:
        # Each pod = one physical BM.GPU4.8 node (8 GPUs).
        completions: 2
        parallelism: 2
        completionMode: Indexed
        template:
          spec:
            restartPolicy: Never
            hostNetwork: true
            dnsPolicy: ClusterFirstWithHostNet

            nodeSelector:
              node.kubernetes.io/instance-type: BM.GPU4.8
              nvidia.com/gpu.present: "true"

            tolerations:
            - key: nvidia.com/gpu
              operator: Exists
              effect: NoSchedule

            volumes:
            - name: shm
              emptyDir:
                medium: Memory
                sizeLimit: 128Gi
            - name: devinf
              hostPath:
                path: /dev/infiniband

            containers:
            - name: torchtitan
              image: aga.ocir.io/hpc/cpv/torchtitan_cuda/torchtitan:a100-latest
              imagePullPolicy: Always

              command: ["/bin/bash", "-c"]
              args:
              - |
                set -euo pipefail

                NODE_RANK="${JOB_COMPLETION_INDEX}"
                NPROC_PER_NODE="8"
                POD_FQDN="${JOBSET_NAME}-workers-0-${NODE_RANK}.${JOBSET_NAME}.${POD_NAMESPACE}.svc.cluster.local"
                MASTER_ADDR="${JOBSET_NAME}-workers-0-0.${JOBSET_NAME}.${POD_NAMESPACE}.svc.cluster.local"
                MASTER_PORT="29500"
                IS_HOST=$([ "${NODE_RANK}" -eq "0" ] && echo "true" || echo "false")

                echo "torchtitan health-check (a100) | node_rank=${NODE_RANK}/${NNODES} is_host=${IS_HOST} local_addr=${POD_FQDN} master=${MASTER_ADDR}:${MASTER_PORT}"

                torchrun \
                  --nnodes="${NNODES}" \
                  --nproc_per_node="${NPROC_PER_NODE}" \
                  --rdzv-backend=c10d \
                  --rdzv-endpoint="${MASTER_ADDR}:${MASTER_PORT}" \
                  --rdzv-conf="is_host=${IS_HOST}" \
                  --rdzv-id="${JOBSET_NAME}" \
                  --local_addr="${POD_FQDN}" \
                  --node_rank="${NODE_RANK}" \
                  -m torchtitan.train \
                    --module llama3 \
                    --config llama3_health_check \
                  2>&1 | tee /tmp/torchtitan.log

                TFLOPS=$(grep -oP 'tflops:\s*\K[0-9,]+\.?[0-9]*' /tmp/torchtitan.log | tail -1 | tr -d ',')
                MFU=$(grep -oP 'mfu:\s*\K[0-9.]+(?=%)' /tmp/torchtitan.log | tail -1)
                echo ""
                echo "==========================================="
                echo "TORCHTITAN HEALTH CHECK RESULT"
                echo "  Node rank : ${NODE_RANK}"
                echo "  TFLOPs    : ${TFLOPS:-N/A}"
                echo "  MFU       : ${MFU:-N/A}%"
                echo "  Status    : PASS"
                echo "==========================================="

              env:
              - name: NNODES
                value: "2"
              - name: LOCAL_BATCH_SIZE
                value: "1"
              - name: SEQ_LEN
                value: "1024"
              - name: STEPS
                value: "25"
              - name: COMPILE
                value: "0"
              - name: JOBSET_NAME
                value: "torchtitan-health-check-a100"
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace

              # NVIDIA / NCCL / RDMA
              - name: NCCL_DEBUG
                value: "WARN"
              - name: NCCL_SOCKET_IFNAME
                value: "eth0"
              - name: NCCL_CUMEM_ENABLE
                value: "1"
              - name: NCCL_NET_PLUGIN
                value: "none"
              - name: PYTORCH_ALLOC_CONF
                value: "expandable_segments:True"

              resources:
                limits:
                  nvidia.com/gpu: "8"
                  ephemeral-storage: "32Gi"
                requests:
                  nvidia.com/gpu: "8"
                  cpu: "100"
                  memory: "1Ti"
                  ephemeral-storage: "32Gi"

              securityContext:
                privileged: true
                capabilities:
                  add: ["IPC_LOCK", "SYS_PTRACE"]

              volumeMounts:
              - mountPath: /dev/shm
                name: shm
              - mountPath: /dev/infiniband
                name: devinf